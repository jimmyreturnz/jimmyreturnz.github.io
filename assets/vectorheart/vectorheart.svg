<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Vectorheart element set — original artwork for this site.
    Every symbol paints with currentColor, plus two CSS custom properties (named with a leading double dash in CSS):
      var(vh-ink)    outline / contrast colour   (default deep plum)
      var(vh-shine)  highlight colour            (default white)
    Usage:  <svg class="vh" style="color:#ffb3d1"><use href="assets/vectorheart/vectorheart.svg#vh-arrow"/></svg>
    All symbols are drawn pointing "up-right" on a 0° baseline; rotate the
    parent (e.g. -35deg) to get the diagonal speed-line composition.
  -->
  <defs>
    <linearGradient id="vh-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--vh-shine, #fff)" stop-opacity=".95"/>
      <stop offset=".45" stop-color="var(--vh-shine, #fff)" stop-opacity=".15"/>
      <stop offset=".46" stop-color="var(--vh-shine, #fff)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--vh-shine, #fff)" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="vh-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--vh-shine, #fff)" stop-opacity="0"/>
      <stop offset=".7" stop-color="var(--vh-shine, #fff)" stop-opacity=".9"/>
      <stop offset="1" stop-color="var(--vh-shine, #fff)" stop-opacity="0"/>
    </linearGradient>
    <path id="vh-heart-path" d="M50 86C22 66 6 50 6 30 6 16 17 6 30 6c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 20-16 36-44 56z"/>
  </defs>

  <!-- 1. Big arrow: thick stem with a bent "kick" and an outlined head -->
  <symbol id="vh-arrow" viewBox="0 0 240 60">
    <path d="M4 38h150l14-14h36V8l32 22-32 22V36h-30l-14 14H4z" fill="currentColor"
          stroke="var(--vh-ink, #3b2a4d)" stroke-width="4" stroke-linejoin="round"/>
  </symbol>

  <!-- 2. Thin arrow: hairline stem + chunky head -->
  <symbol id="vh-arrow-thin" viewBox="0 0 240 40">
    <path d="M2 18h196v4H2z" fill="var(--vh-ink, #3b2a4d)"/>
    <path d="M190 4l44 16-44 16 10-16z" fill="currentColor" stroke="var(--vh-ink, #3b2a4d)"
          stroke-width="3" stroke-linejoin="round"/>
  </symbol>

  <!-- 3. Chevron row  >>>>>> -->
  <symbol id="vh-chevrons" viewBox="0 0 168 24">
    <g fill="currentColor" stroke="var(--vh-ink, #3b2a4d)" stroke-width="1.5" stroke-linejoin="round">
      <path id="vh-chev" d="M0 2h10l12 10-12 10H0l12-10z"/>
      <use href="#vh-chev" x="24"/><use href="#vh-chev" x="48"/><use href="#vh-chev" x="72"/>
      <use href="#vh-chev" x="96"/><use href="#vh-chev" x="120"/><use href="#vh-chev" x="144"/>
    </g>
  </symbol>

  <!-- 4. Triangle cluster  ▲▼▲▼ -->
  <symbol id="vh-triangles" viewBox="0 0 120 24">
    <g fill="currentColor">
      <path d="M0 22L10 2l10 20z"/><path d="M14 2h20L24 22z"/>
      <path d="M38 22L48 2l10 20z"/><path d="M52 2h20L62 22z"/>
      <path d="M76 22L86 2l10 20z"/><path d="M90 2h20l-10 20z"/>
    </g>
  </symbol>

  <!-- 5. Dotted line -->
  <symbol id="vh-dots" viewBox="0 0 200 12">
    <g fill="currentColor">
      <circle cx="6" cy="6" r="4"/><circle cx="26" cy="6" r="4"/><circle cx="46" cy="6" r="4"/>
      <circle cx="66" cy="6" r="4"/><circle cx="86" cy="6" r="4"/><circle cx="106" cy="6" r="4"/>
      <circle cx="126" cy="6" r="4"/><circle cx="146" cy="6" r="4"/><circle cx="166" cy="6" r="4"/>
      <circle cx="186" cy="6" r="4"/>
    </g>
  </symbol>

  <!-- 6. Hatch strip  ||||||| (slanted) -->
  <symbol id="vh-hatch" viewBox="0 0 200 28">
    <g fill="currentColor"><path d="M8 0h3l-8 28h-3z"/><path d="M15 0h3l-8 28h-3z"/><path d="M22 0h3l-8 28h-3z"/><path d="M29 0h3l-8 28h-3z"/><path d="M36 0h3l-8 28h-3z"/><path d="M43 0h3l-8 28h-3z"/><path d="M50 0h3l-8 28h-3z"/><path d="M57 0h3l-8 28h-3z"/><path d="M64 0h3l-8 28h-3z"/><path d="M71 0h3l-8 28h-3z"/><path d="M78 0h3l-8 28h-3z"/><path d="M85 0h3l-8 28h-3z"/><path d="M92 0h3l-8 28h-3z"/><path d="M99 0h3l-8 28h-3z"/><path d="M106 0h3l-8 28h-3z"/><path d="M113 0h3l-8 28h-3z"/><path d="M120 0h3l-8 28h-3z"/><path d="M127 0h3l-8 28h-3z"/><path d="M134 0h3l-8 28h-3z"/><path d="M141 0h3l-8 28h-3z"/><path d="M148 0h3l-8 28h-3z"/><path d="M155 0h3l-8 28h-3z"/><path d="M162 0h3l-8 28h-3z"/><path d="M169 0h3l-8 28h-3z"/><path d="M176 0h3l-8 28h-3z"/><path d="M183 0h3l-8 28h-3z"/><path d="M190 0h3l-8 28h-3z"/><path d="M197 0h3l-8 28h-3z"/></g>
  </symbol>

  <!-- 7. Target rings (concentric) -->
  <symbol id="vh-target" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="56" fill="var(--vh-ink, #3b2a4d)"/>
    <circle cx="60" cy="60" r="46" fill="currentColor"/>
    <circle cx="60" cy="60" r="38" fill="var(--vh-ink, #3b2a4d)"/>
    <circle cx="60" cy="60" r="28" fill="var(--vh-shine, #fff)"/>
    <circle cx="60" cy="60" r="20" fill="var(--vh-ink, #3b2a4d)"/>
    <circle cx="60" cy="60" r="10" fill="currentColor"/>
  </symbol>

  <!-- 8. Thin rings: big hairline circle stack (background ornament) -->
  <symbol id="vh-rings" viewBox="0 0 200 200">
    <g fill="none" stroke="currentColor">
      <circle cx="100" cy="100" r="96" stroke-width="6"/>
      <circle cx="100" cy="100" r="82" stroke-width="2"/>
      <circle cx="100" cy="100" r="74" stroke-width="2"/>
      <circle cx="100" cy="100" r="60" stroke-width="10"/>
      <circle cx="100" cy="100" r="44" stroke-width="2" stroke-dasharray="4 6"/>
    </g>
  </symbol>

  <!-- 9. Gloss slab: speed bar with angled end + glass highlight -->
  <symbol id="vh-slab" viewBox="0 0 320 56">
    <path d="M0 4h290l26 24-26 24H0z" fill="currentColor"/>
    <path d="M0 4h290l26 24-26 24H0z" fill="url(#vh-gloss)"/>
    <path d="M30 4h240l-20 22H10z" fill="url(#vh-sheen)" opacity=".6"/>
    <path d="M0 4h290l26 24-26 24H0z" fill="none" stroke="var(--vh-ink, #3b2a4d)" stroke-width="3"/>
  </symbol>

  <!-- 10. Solid heart with sticker outline + shine -->
  <symbol id="vh-heart" viewBox="0 0 100 92">
    <path d="M50 86C22 66 6 50 6 30 6 16 17 6 30 6c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 20-16 36-44 56z"
          fill="currentColor" stroke="var(--vh-ink, #3b2a4d)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M22 22c4-6 12-7 16-3" fill="none" stroke="var(--vh-shine, #fff)" stroke-width="6" stroke-linecap="round"/>
  </symbol>

  <!-- 11. Double-outline heart -->
  <symbol id="vh-heart-outline" viewBox="0 0 100 92">
    <g fill="none" stroke-linejoin="round">
      <path d="M50 86C22 66 6 50 6 30 6 16 17 6 30 6c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 20-16 36-44 56z"
            stroke="currentColor" stroke-width="6"/>
      <path d="M50 72C30 57 18 46 18 31c0-8 6-14 13-14 7 0 13 5 19 13 6-8 12-13 19-13 7 0 13 6 13 14 0 15-12 26-32 41z"
            stroke="currentColor" stroke-width="2.5"/>
    </g>
  </symbol>

  <!-- 12. Target heart: concentric hearts (heart version of the rings) -->
  <symbol id="vh-heart-target" viewBox="0 0 100 92">
    <use href="#vh-heart-path" transform="translate(50 46) scale(1) translate(-50 -46)" fill="var(--vh-ink, #3b2a4d)"/>
    <use href="#vh-heart-path" transform="translate(50 46) scale(0.78) translate(-50 -46)" fill="currentColor"/>
    <use href="#vh-heart-path" transform="translate(50 46) scale(0.58) translate(-50 -46)" fill="var(--vh-ink, #3b2a4d)"/>
    <use href="#vh-heart-path" transform="translate(50 46) scale(0.4) translate(-50 -46)" fill="var(--vh-shine, #fff)"/>
    <use href="#vh-heart-path" transform="translate(50 46) scale(0.2) translate(-50 -46)" fill="currentColor"/>
  </symbol>

  <!-- 13. Heart arrowhead: arrow whose head is a heart (signature motif) -->
  <symbol id="vh-heart-arrow" viewBox="0 0 260 70">
    <path d="M4 26h196v18H4z" fill="currentColor" stroke="var(--vh-ink, #3b2a4d)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M4 30h150" stroke="var(--vh-shine, #fff)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <use href="#vh-heart-path" transform="translate(226 35) rotate(-90) scale(.66) translate(-50 -46)"
         fill="currentColor" stroke="var(--vh-ink, #3b2a4d)" stroke-width="7" stroke-linejoin="round"/>
  </symbol>

  <!-- 14. Sparkle (4-point star) -->
  <symbol id="vh-sparkle" viewBox="0 0 60 60">
    <path d="M30 0c3 17 13 27 30 30-17 3-27 13-30 30C27 43 17 33 0 30 17 27 27 17 30 0z" fill="currentColor"/>
  </symbol>

  <!-- 15. Plus grid  + + + -->
  <symbol id="vh-plus" viewBox="0 0 96 32">
    <g fill="currentColor">
      <path d="M6 13h4V9h4v4h4v4h-4v4h-4v-4H6z"/><path d="M38 13h4V9h4v4h4v4h-4v4h-4v-4h-4z"/>
      <path d="M70 13h4V9h4v4h4v4h-4v4h-4v-4h-4z"/>
    </g>
  </symbol>

  <!-- 16. Equaliser bars (rhythm-game nod; animate scaleY per bar) -->
  <symbol id="vh-eq" viewBox="0 0 84 48">
    <g fill="currentColor">
      <rect x="0" y="20" width="8" height="28" rx="2"/><rect x="12" y="8" width="8" height="40" rx="2"/>
      <rect x="24" y="28" width="8" height="20" rx="2"/><rect x="36" y="0" width="8" height="48" rx="2"/>
      <rect x="48" y="16" width="8" height="32" rx="2"/><rect x="60" y="30" width="8" height="18" rx="2"/>
      <rect x="72" y="12" width="8" height="36" rx="2"/>
    </g>
  </symbol>
  <symbol id="vh-camera" viewBox="0 0 120 96">
    <rect x="34" y="4" width="40" height="22" rx="7" fill="var(--vh-ink, #3b2a4d)"/>
    <rect x="41" y="10" width="26" height="14" rx="3" fill="currentColor"/>
    <rect x="2" y="16" width="116" height="78" rx="16" fill="var(--vh-ink, #3b2a4d)"/>
    <rect x="10" y="24" width="100" height="62" rx="10" fill="currentColor"/>
    <rect x="16" y="30" width="16" height="9" rx="3" fill="var(--vh-shine, #fff)"/>
    <circle cx="60" cy="55" r="31" fill="var(--vh-ink, #3b2a4d)"/>
    <circle cx="60" cy="55" r="24" fill="var(--vh-shine, #fff)"/>
    <circle cx="60" cy="55" r="18" fill="var(--vh-ink, #3b2a4d)"/>
    <circle cx="60" cy="55" r="10" fill="currentColor"/>
    <circle cx="54" cy="49" r="4" fill="var(--vh-shine, #fff)"/>
  </symbol>

  <symbol id="vh-ship" viewBox="0 0 136 84">
    <rect x="10" y="12" width="22" height="40" rx="4" fill="var(--vh-ink, #3b2a4d)"/>
    <rect x="15" y="17" width="12" height="8" rx="2" fill="var(--vh-shine, #fff)"/>
    <rect x="15" y="29" width="12" height="18" rx="2" fill="currentColor"/>
    <rect x="34" y="32" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="37" y="35" width="18" height="12" fill="currentColor"/><rect x="45" y="35" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="58" y="32" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="61" y="35" width="18" height="12" fill="var(--vh-shine, #fff)"/><rect x="69" y="35" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="82" y="32" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="85" y="35" width="18" height="12" fill="currentColor"/><rect x="93" y="35" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="106" y="32" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="109" y="35" width="18" height="12" fill="var(--vh-shine, #fff)"/><rect x="117" y="35" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="46" y="14" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="49" y="17" width="18" height="12" fill="var(--vh-shine, #fff)"/><rect x="57" y="17" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="70" y="14" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="73" y="17" width="18" height="12" fill="currentColor"/><rect x="81" y="17" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/><rect x="94" y="14" width="24" height="18" rx="2" fill="var(--vh-ink, #3b2a4d)"/><rect x="97" y="17" width="18" height="12" fill="var(--vh-shine, #fff)"/><rect x="105" y="17" width="2" height="12" fill="var(--vh-ink, #3b2a4d)"/>
    <path d="M0 48 H136 L120 82 H14 Z" fill="var(--vh-ink, #3b2a4d)"/>
    <path d="M9 55 H126 L115 75 H19 Z" fill="currentColor"/>
    <rect x="22" y="59" width="40" height="5" rx="2.5" fill="var(--vh-shine, #fff)"/>
  </symbol>
</svg>
