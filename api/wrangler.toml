name = "jimmyreturnz-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# sites allowed to call the API (comma separated); add the pages.dev / jimmyreturnz.dev address when deploying
ALLOWED_ORIGINS = "https://jimmyreturnz.github.io,http://localhost:4321,http://localhost:4330"

[[d1_databases]]
binding = "DB"
database_name = "board"
database_id = "db5d1946-1ea0-4758-a2ee-798bcec3995c"

# Secrets (never in this file): `wrangler secret put NAME` for production, `.dev.vars` for local dev.
#   TURNSTILE_SECRET  Turnstile secret key
#   VISITOR_SECRET    long random string; the daily key for visitor fingerprints is derived from it
#   ADMIN_TOKEN       long random string; the owner pastes it on /community/admin/ to approve messages

# flood guard: requests per visitor per minute, all routes (see the middleware in src/index.ts)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
