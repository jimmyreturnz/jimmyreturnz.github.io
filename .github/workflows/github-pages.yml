# Builds the site and publishes it at https://jimmyreturnz.github.io/ (owner, 2026-11-23: GitHub Pages first, Cloudflare Pages later).
# Runs on every push to main and once a day so the Stats Cards stay fresh. GitHub Pages ignores assets/_headers (no CSP there)
# and the Message Board stays hidden until the API exists (no PUBLIC_API_URL).
name: GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *' # 04:17 Bangkok time
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://jimmyreturnz.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
