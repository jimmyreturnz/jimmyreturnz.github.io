# Builds the site and publishes it at https://jimmyreturnz.github.io/ (owner, 2026-11-23: GitHub Pages first, Cloudflare Pages later).
# Runs on every push to main and once a day so the Stats Cards stay fresh. GitHub Pages ignores assets/_headers (no CSP there)
# The Message Board talks to the Worker in api/ (deployed with `bun run deploy` there).
name: GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *' # midnight Bangkok time (UTC+7)
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (third-party: pinned)
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://jimmyreturnz.github.io
          # public values (the Turnstile secret and ADMIN_TOKEN live only in the Worker)
          PUBLIC_API_URL: https://jimmyreturnz-api.jimmyreturnz.workers.dev
          PUBLIC_TURNSTILE_SITEKEY: 0x4AAAAAAGPFeUoQT9ssSVGV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
