# Rebuilds the site once a day so the Stats Cards (osu!, TETR.IO) stay fresh.
# The build itself runs on Cloudflare Pages (`bun run build` fetches stats first).
# Setup: Cloudflare Pages → project → Settings → Builds → Deploy hooks → create one,
# then add its URL as the repo secret CF_PAGES_DEPLOY_HOOK.
name: Daily rebuild
on:
  schedule:
    - cron: '17 21 * * *' # 04:17 Bangkok time
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Build triggered"
